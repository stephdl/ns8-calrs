#
# calrs state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# The volume carries secret.key, without which the stored CalDAV and SMTP
# credentials cannot be decrypted. The consistent database snapshot comes from
# module-dump-state and overwrites calrs.db at restore time.
# state/discovery.env is deliberately excluded: it is regenerated at every start
# and holds the smarthost password.

state/calrs-backup.db
volumes/calrs-data
